name: Verify application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: verification-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
